version: "3.9"

# Paperclip-native governance stack.
#
#   Paperclip board (the panel)  → :3000   — companies, agents, budgets, dashboard, audit
#   Integrations sidecar         → :8080   — Composio-backed research / email / calendar / CRM
#
# Paperclip IS the panel and the multi-business control plane. Each business is a Paperclip
# "company" (imported from a company package), fully isolated. The Integrations sidecar is the
# only custom service: it gives the agents real lead-gen / outreach / CRM tools via Composio.
#
# The canonical Paperclip install is `npx paperclipai onboard` (see scripts/deploy-vps.sh for a
# production systemd + nginx setup). This compose file runs Paperclip in a Node container for
# convenience and the Integrations sidecar alongside it.

services:

  # ── Paperclip board — the panel / control plane ───────────────────────────
  paperclip:
    image: node:20-bookworm-slim
    working_dir: /app
    volumes:
      - paperclip_data:/root/.paperclip
    environment:
      # Paperclip stores its own config; agents get model keys via company secrets in the UI.
      PAPERCLIP_DEPLOYMENT_MODE: ${PAPERCLIP_DEPLOYMENT_MODE:-authenticated}
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    command: >
      sh -c "
        apt-get update && apt-get install -y python3 make g++ curl >/dev/null 2>&1;
        npx -y paperclipai@latest onboard --yes --bind lan;
      "
    restart: unless-stopped

  # ── Integrations sidecar — the agents' real tools (Composio) ──────────────
  integrations:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "main.py", "--specialists", "--port", "8080"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      COMPOSIO_MAX_CONCURRENT: ${COMPOSIO_MAX_CONCURRENT:-10}
      SPECIALIST_MODEL: ${SPECIALIST_MODEL:-deepseek/deepseek-chat-v4}
      STATE_DB_PATH: /data/governance.db
    volumes:
      - integrations_data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Archivist — back up every action/thought to Obsidian + Notion ─────────
  archivist:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "main.py", "--archivist"]
    environment:
      PAPERCLIP_API_URL: http://paperclip:3000
      PAPERCLIP_API_KEY: ${PAPERCLIP_API_KEY:-}
      OBSIDIAN_VAULT_PATH: /vault
      NOTION_API_KEY: ${NOTION_API_KEY:-}
      NOTION_PARENT_PAGE_ID: ${NOTION_PARENT_PAGE_ID:-}
      INTEGRATIONS_URL: http://integrations:8080
      STATE_DB_PATH: /data/governance.db
    volumes:
      - integrations_data:/data
      - ${OBSIDIAN_VAULT_PATH:-./vault}:/vault
    depends_on:
      - paperclip
    restart: unless-stopped

  # ── Slack relay — talk to your CEO from Slack (optional) ──────────────────
  slack:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "main.py", "--slack-relay"]
    environment:
      PAPERCLIP_API_URL: http://paperclip:3000
      PAPERCLIP_API_KEY: ${PAPERCLIP_API_KEY:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_OWNER_CHANNEL: ${SLACK_OWNER_CHANNEL:-#governance}
      SLACK_RELAY_PORT: "3001"
      STATE_DB_PATH: /data/governance.db
    volumes:
      - integrations_data:/data
    ports:
      - "3001:3001"
    depends_on:
      - paperclip
    restart: unless-stopped

volumes:
  paperclip_data:
  integrations_data:
