version: "3.9"

# Full governance stack:
#   Paperclip dashboard      → localhost:3000
#   Governance control plane → localhost:8000
#   OpenSwarm specialists    → localhost:8080
#   Slack bridge             → localhost:3001

services:

  # ── Layer 1: Paperclip (financial controls + dashboard) ───────────────────
  paperclip:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - paperclip_data:/app/.paperclip
    environment:
      PORT: "3000"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      NODE_ENV: production
    ports:
      - "3000:3000"
    command: >
      sh -c "
        npm install -g pnpm &&
        npx paperclipai@latest onboard --yes --port 3000
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Layer 2+3: Governance control plane (CrewAI orchestration) ────────────
  governance:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      PAPERCLIP_URL: http://paperclip:3000
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      STATE_DB_PATH: /data/governance.db
      AUDIT_LOG_PATH: /data/audit.jsonl
      EXPERT_MODEL: ${EXPERT_MODEL:-deepseek/deepseek-chat-v4}
      MODERATOR_MODEL: ${MODERATOR_MODEL:-anthropic/claude-opus-4-8}
      EXEC_MODEL: ${EXEC_MODEL:-anthropic/claude-sonnet-4-6}
      SALES_MODEL: ${SALES_MODEL:-moonshotai/kimi-2}
      MARKETING_MODEL: ${MARKETING_MODEL:-moonshotai/kimi-2}
      COMPOSIO_MAX_CONCURRENT: ${COMPOSIO_MAX_CONCURRENT:-10}
      BUDGET_OVERRIDE: ${BUDGET_OVERRIDE:-false}
    volumes:
      - governance_data:/data
    ports:
      - "8000:8000"
      - "3001:3001"
    depends_on:
      paperclip:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── OpenSwarm specialist layer (separate process for isolation) ───────────
  specialists:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "main.py", "--specialists", "--port", "8080"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      PAPERCLIP_URL: http://paperclip:3000
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      STATE_DB_PATH: /data/governance.db
      SPECIALIST_MODEL: ${EXPERT_MODEL:-deepseek/deepseek-chat-v4}
      COMPOSIO_MAX_CONCURRENT: ${COMPOSIO_MAX_CONCURRENT:-10}
    volumes:
      - governance_data:/data
    ports:
      - "8080:8080"
    depends_on:
      - paperclip
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  paperclip_data:
  governance_data:
