<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Governance Panel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f14;
      --surface:  #161922;
      --border:   #252830;
      --text:     #e2e6f0;
      --muted:    #6b7280;
      --accent:   #6366f1;
      --accent2:  #818cf8;
      --success:  #22c55e;
      --warn:     #f59e0b;
      --error:    #ef4444;
      --info:     #38bdf8;
      --radius:   8px;
      --sidebar:  260px;
    }

    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }

    /* ── Top bar ── */
    .topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 0 20px; height: 52px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .topbar-logo { font-size: 18px; font-weight: 700; color: var(--accent2); letter-spacing: -.5px; }
    .topbar-logo span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
    .topbar-spacer { flex: 1; }
    .topbar-status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── Layout ── */
    .layout { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar); flex-shrink: 0;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .8px; color: var(--muted);
    }
    .btn-icon {
      background: none; border: 1px solid var(--border); color: var(--text);
      cursor: pointer; border-radius: 6px; padding: 3px 8px; font-size: 16px;
      line-height: 1; transition: background .15s;
    }
    .btn-icon:hover { background: var(--border); }

    .biz-list { flex: 1; overflow-y: auto; padding: 8px; }
    .biz-item {
      padding: 10px 12px; border-radius: var(--radius); cursor: pointer;
      border: 1px solid transparent; transition: all .15s; margin-bottom: 4px;
    }
    .biz-item:hover { background: rgba(99,102,241,.08); border-color: var(--border); }
    .biz-item.active { background: rgba(99,102,241,.15); border-color: var(--accent); }
    .biz-name { font-size: 14px; font-weight: 500; }
    .biz-teams { font-size: 11px; color: var(--muted); margin-top: 3px; }

    /* ── Main area ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Business header ── */
    .biz-header {
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      background: var(--surface); display: flex; align-items: center; gap: 12px;
      flex-shrink: 0;
    }
    .biz-header-name { font-size: 16px; font-weight: 600; }
    .biz-header-id { font-size: 11px; color: var(--muted); font-family: monospace; }
    .biz-header-spacer { flex: 1; }
    .team-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      font-size: 11px; padding: 2px 8px; border-radius: 20px;
      border: 1px solid; font-weight: 500;
    }
    .badge-exec   { border-color: #818cf8; color: #818cf8; }
    .badge-sales  { border-color: #34d399; color: #34d399; }
    .badge-mktg   { border-color: #f472b6; color: #f472b6; }
    .btn-sm {
      font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      transition: background .15s;
    }
    .btn-sm:hover { background: var(--border); }

    /* ── Event feed ── */
    .feed-container { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .feed-empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; color: var(--muted); gap: 8px;
    }
    .feed-empty-icon { font-size: 40px; opacity: .4; }

    .event-row {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.04);
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }

    .event-time { font-size: 11px; color: var(--muted); font-family: monospace; flex-shrink: 0; padding-top: 2px; }
    .event-level {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 5px;
    }
    .level-info    { background: var(--info); }
    .level-success { background: var(--success); }
    .level-warning { background: var(--warn); }
    .level-error   { background: var(--error); }

    .event-body { flex: 1; min-width: 0; }
    .event-header { display: flex; gap: 8px; align-items: baseline; }
    .event-agent { font-size: 12px; font-weight: 600; color: var(--accent2); }
    .event-type { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .event-msg { font-size: 13px; color: var(--text); margin-top: 2px; word-break: break-word; line-height: 1.4; }

    /* ── Chat ── */
    .chat-panel {
      border-top: 1px solid var(--border); background: var(--surface);
      display: flex; flex-direction: column; flex-shrink: 0;
      height: 220px;
    }
    .chat-history {
      flex: 1; overflow-y: auto; padding: 10px 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .chat-msg { display: flex; gap: 8px; }
    .chat-msg.user { flex-direction: row-reverse; }
    .chat-bubble {
      max-width: 75%; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.45;
    }
    .chat-msg.user   .chat-bubble { background: var(--accent); color: #fff; }
    .chat-msg.ceo    .chat-bubble { background: var(--border); color: var(--text); }
    .chat-from { font-size: 10px; color: var(--muted); align-self: flex-end; }

    .chat-input-row {
      display: flex; gap: 8px; padding: 10px 16px;
      border-top: 1px solid var(--border);
    }
    .chat-input {
      flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 12px; color: var(--text); font-size: 14px; outline: none; resize: none;
      font-family: inherit;
    }
    .chat-input:focus { border-color: var(--accent); }
    .chat-input::placeholder { color: var(--muted); }
    .btn-send {
      background: var(--accent); border: none; border-radius: 8px;
      color: #fff; cursor: pointer; padding: 8px 16px; font-size: 14px; font-weight: 500;
      transition: background .15s; white-space: nowrap;
    }
    .btn-send:hover { background: var(--accent2); }
    .btn-send:disabled { opacity: .4; cursor: default; }

    /* ── No business selected ── */
    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; color: var(--muted);
    }
    .empty-state-icon { font-size: 56px; opacity: .3; }
    .empty-state h2 { font-size: 20px; color: var(--text); font-weight: 500; }
    .btn-primary {
      background: var(--accent); border: none; border-radius: 8px;
      color: #fff; cursor: pointer; padding: 10px 22px; font-size: 14px; font-weight: 600;
      transition: background .15s;
    }
    .btn-primary:hover { background: var(--accent2); }

    /* ── Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.6); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 28px; width: 420px; max-width: 90vw;
    }
    .modal h2 { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    .field input, .field textarea, .field select {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 12px; color: var(--text); font-size: 14px;
      outline: none; font-family: inherit;
    }
    .field input:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 72px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .btn-cancel {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); cursor: pointer; padding: 8px 16px; font-size: 14px;
    }
    .btn-cancel:hover { background: var(--border); }

    .teams-check { display: flex; gap: 10px; flex-wrap: wrap; }
    .teams-check label {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; cursor: pointer; color: var(--text);
    }
    .teams-check input[type=checkbox] { accent-color: var(--accent); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-logo">Governance <span>autonomous business panel</span></div>
  <div class="topbar-spacer"></div>
  <div class="topbar-status">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">connecting…</span>
  </div>
</div>

<!-- Layout -->
<div class="layout">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      Businesses
      <button class="btn-icon" title="Add business" onclick="openModal()">+</button>
    </div>
    <div class="biz-list" id="biz-list">
      <!-- rendered by JS -->
    </div>
  </div>

  <!-- Main -->
  <div class="main" id="main-area">
    <!-- rendered by JS based on selection -->
  </div>

</div>

<!-- Add Business Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>New Business</h2>
    <div class="field">
      <label>Business Name *</label>
      <input type="text" id="biz-name" placeholder="Acme Corp" />
    </div>
    <div class="field">
      <label>Description (optional)</label>
      <textarea id="biz-desc" placeholder="What does this business do?"></textarea>
    </div>
    <div class="field">
      <label>Initial Teams</label>
      <div class="teams-check">
        <label><input type="checkbox" value="exec_team" checked /> Executive</label>
        <label><input type="checkbox" value="sales" /> Sales</label>
        <label><input type="checkbox" value="marketing" /> Marketing</label>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="createBusiness()">Create Business</button>
    </div>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let businesses = [];
let selectedBiz = null;
let eventSource = null;
let chatHistory = {}; // business_id -> [{role, content}]
let chatLoading = false;

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  await fetchBusinesses();
  setInterval(fetchBusinesses, 30000); // refresh sidebar every 30s
}

// ── API helpers ───────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (!r.ok) {
    const err = await r.text();
    throw new Error(`${r.status}: ${err}`);
  }
  if (r.status === 204) return null;
  return r.json();
}

// ── Businesses ────────────────────────────────────────────────────────────────
async function fetchBusinesses() {
  try {
    const data = await api('GET', '/businesses');
    businesses = data.businesses;
    renderSidebar();
    updateStatus(true);
  } catch (e) {
    updateStatus(false);
  }
}

function renderSidebar() {
  const el = document.getElementById('biz-list');
  if (businesses.length === 0) {
    el.innerHTML = `<div style="padding:16px;text-align:center;color:var(--muted);font-size:13px;">
      No businesses yet.<br/>Click + to add one.
    </div>`;
    return;
  }
  el.innerHTML = businesses.map(b => {
    const teamLabels = b.teams.map(t => teamLabel(t)).join(', ');
    const active = selectedBiz && selectedBiz.id === b.id ? 'active' : '';
    return `<div class="biz-item ${active}" onclick="selectBusiness('${b.id}')">
      <div class="biz-name">${esc(b.name)}</div>
      <div class="biz-teams">${esc(teamLabels)}</div>
    </div>`;
  }).join('');
}

function teamLabel(t) {
  return { exec_team: 'Executive', sales: 'Sales', marketing: 'Marketing' }[t] || t;
}

function selectBusiness(id) {
  selectedBiz = businesses.find(b => b.id === id);
  renderSidebar();
  renderMain();
  subscribeToEvents(id);
}

// ── Main area ─────────────────────────────────────────────────────────────────
function renderMain() {
  const el = document.getElementById('main-area');

  if (!selectedBiz) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">🏢</div>
        <h2>Select a business</h2>
        <p>Or create one to get started.</p>
        <button class="btn-primary" onclick="openModal()">+ New Business</button>
      </div>`;
    return;
  }

  const b = selectedBiz;
  const teamBadges = b.teams.map(t => {
    const cls = {exec_team:'exec',sales:'sales',marketing:'mktg'}[t]||'exec';
    return `<span class="badge badge-${cls}">${teamLabel(t)}</span>`;
  }).join('');

  el.innerHTML = `
    <div class="biz-header">
      <div>
        <div class="biz-header-name">${esc(b.name)}</div>
        <div class="biz-header-id">${b.id} · ${b.tenant_id}</div>
      </div>
      <div class="team-badges">${teamBadges}</div>
      <div class="biz-header-spacer"></div>
      <button class="btn-sm" onclick="showAddTeam()">+ Team</button>
      <button class="btn-sm" onclick="clearChat()">Clear Chat</button>
      <button class="btn-sm" style="color:var(--error);border-color:var(--error);" onclick="deleteBiz('${b.id}')">Delete</button>
    </div>

    <div class="feed-container" id="feed">
      <div class="feed-empty" id="feed-empty">
        <div class="feed-empty-icon">📡</div>
        <div>Waiting for agent activity…</div>
        <div style="font-size:12px;color:var(--muted);">Start a conversation below to see your agents work.</div>
      </div>
    </div>

    <div class="chat-panel">
      <div class="chat-history" id="chat-history"></div>
      <div class="chat-input-row">
        <textarea class="chat-input" id="chat-input" rows="2"
          placeholder="Talk to your CEO — ask for a status update, launch a campaign, review finances…"
          onkeydown="handleChatKey(event)"></textarea>
        <button class="btn-send" id="btn-send" onclick="sendChat()">Send</button>
      </div>
    </div>`;

  // Restore chat history
  renderChatHistory();
}

// ── SSE ───────────────────────────────────────────────────────────────────────
function subscribeToEvents(businessId) {
  if (eventSource) { eventSource.close(); eventSource = null; }

  const lastTs = 0;
  const url = `/stream/${businessId}?since=${lastTs}`;
  eventSource = new EventSource(url);

  eventSource.onmessage = (e) => {
    try {
      const event = JSON.parse(e.data);
      appendEvent(event);
    } catch {}
  };

  eventSource.onerror = () => {
    // Will auto-reconnect
  };
}

function appendEvent(ev) {
  const feed = document.getElementById('feed');
  if (!feed) return;

  // Hide empty state
  const empty = document.getElementById('feed-empty');
  if (empty) empty.style.display = 'none';

  const time = new Date(ev.ts * 1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const levelCls = `level-${ev.level || 'info'}`;

  const row = document.createElement('div');
  row.className = 'event-row';
  row.innerHTML = `
    <div class="event-time">${esc(time)}</div>
    <div class="event-level ${levelCls}"></div>
    <div class="event-body">
      <div class="event-header">
        <span class="event-agent">${esc(ev.agent_name || ev.team_id || '—')}</span>
        <span class="event-type">${esc(ev.type)}</span>
      </div>
      <div class="event-msg">${esc(ev.message || '')}</div>
    </div>`;

  feed.appendChild(row);
  feed.scrollTop = feed.scrollHeight;
}

// ── Chat ──────────────────────────────────────────────────────────────────────
function handleChatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
}

async function sendChat() {
  if (chatLoading || !selectedBiz) return;
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;

  input.value = '';
  chatLoading = true;
  document.getElementById('btn-send').disabled = true;

  // Add user message to local history
  if (!chatHistory[selectedBiz.id]) chatHistory[selectedBiz.id] = [];
  chatHistory[selectedBiz.id].push({ role: 'user', content: msg });
  renderChatHistory();

  try {
    const data = await api('POST', `/businesses/${selectedBiz.id}/chat`, { message: msg });
    chatHistory[selectedBiz.id].push({ role: 'ceo', content: data.response });
    renderChatHistory();
  } catch (e) {
    chatHistory[selectedBiz.id].push({ role: 'ceo', content: `Error: ${e.message}` });
    renderChatHistory();
  } finally {
    chatLoading = false;
    document.getElementById('btn-send').disabled = false;
    document.getElementById('chat-input')?.focus();
  }
}

function renderChatHistory() {
  const el = document.getElementById('chat-history');
  if (!el || !selectedBiz) return;
  const history = chatHistory[selectedBiz.id] || [];
  el.innerHTML = history.map(m => `
    <div class="chat-msg ${m.role}">
      <div class="chat-bubble">${esc(m.content)}</div>
      <div class="chat-from">${m.role === 'user' ? 'You' : 'CEO'}</div>
    </div>`).join('');
  el.scrollTop = el.scrollHeight;
}

async function clearChat() {
  if (!selectedBiz) return;
  if (!confirm('Reset CEO conversation history?')) return;
  await api('DELETE', `/businesses/${selectedBiz.id}/chat`);
  chatHistory[selectedBiz.id] = [];
  renderChatHistory();
}

// ── Business management ───────────────────────────────────────────────────────
function openModal() {
  document.getElementById('modal').classList.add('open');
  document.getElementById('biz-name').focus();
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('biz-name').value = '';
  document.getElementById('biz-desc').value = '';
}

async function createBusiness() {
  const name = document.getElementById('biz-name').value.trim();
  if (!name) { alert('Name is required'); return; }
  const desc = document.getElementById('biz-desc').value.trim();
  const teams = [...document.querySelectorAll('.teams-check input:checked')].map(i => i.value);
  if (teams.length === 0) { alert('Select at least one team'); return; }

  try {
    const biz = await api('POST', '/businesses', { name, description: desc, teams });
    businesses.unshift(biz);
    closeModal();
    selectBusiness(biz.id);
  } catch (e) {
    alert(`Failed: ${e.message}`);
  }
}

async function deleteBiz(id) {
  if (!confirm('Delete this business? This cannot be undone.')) return;
  await api('DELETE', `/businesses/${id}`);
  businesses = businesses.filter(b => b.id !== id);
  if (selectedBiz && selectedBiz.id === id) {
    selectedBiz = null;
    if (eventSource) { eventSource.close(); eventSource = null; }
  }
  renderSidebar();
  renderMain();
}

async function showAddTeam() {
  const t = prompt('Team type to add:\n  exec_team — Executive Team\n  sales — Sales Team\n  marketing — Marketing Team');
  if (!t) return;
  try {
    const biz = await api('POST', `/businesses/${selectedBiz.id}/teams`, { team_type: t.trim() });
    const idx = businesses.findIndex(b => b.id === biz.id);
    if (idx >= 0) businesses[idx] = biz;
    selectedBiz = biz;
    renderSidebar();
    renderMain();
    subscribeToEvents(biz.id);
  } catch (e) {
    alert(`Failed: ${e.message}`);
  }
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function updateStatus(ok) {
  document.getElementById('status-dot').style.background = ok ? 'var(--success)' : 'var(--error)';
  document.getElementById('status-text').textContent = ok ? 'connected' : 'offline';
}

function esc(str) {
  return String(str ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// Close modal on overlay click
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Keyboard: Escape closes modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

init();
</script>
</body>
</html>
