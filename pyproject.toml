[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "governance"
version = "0.1.0"
description = "Autonomous Agent Governance System"
requires-python = ">=3.10"

[tool.setuptools]
packages = [
    "governance",
    "governance.core",
    "governance.specialists",
    "governance.specialists.tools",
    "governance.integrations",
    "governance.paperclip",
    "governance.web",
]
package-dir = {"governance" = "."}
