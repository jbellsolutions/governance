version: 2
project_name: gov-pp-cli
changelog:
  disable: true
builds:
  - id: gov-pp-cli
    main: ./cmd/gov-pp-cli
    binary: gov-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X gov-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: gov-pp-mcp
    main: ./cmd/gov-pp-mcp
    binary: gov-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: gov-pp-cli
    repository:
      owner: jbellsolutions
      name: homebrew-tap
    homepage: "https://github.com/jbellsolutions/gov-pp-cli"
    description: "The verified subset of the Paperclip board API used to spin up and manage teams of AI agents — whole businesses"
    install: |
      bin.install "gov-pp-cli"
      bin.install "gov-pp-mcp"
